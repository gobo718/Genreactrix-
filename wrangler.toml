# Convenience root config. The canonical Worker config remains worker/wrangler.toml.
name = "genreactrix-ai"
main = "worker/src/index.js"
compatibility_date = "2026-07-01"

[ai]
binding = "AI"

[vars]
WORKERS_AI_VISION_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
GENREACTRIX_FALLBACK_MODEL = "openai/gpt-4.1-mini"
GENREACTRIX_AI_GATEWAY_ID = "default"
